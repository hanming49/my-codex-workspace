<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着蓝色头盔的鹈鹕骑着红色自行车，沿着海边道路前进。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b8e7f4"/><stop offset="1" stop-color="#f4fbef"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#68c8d2"/><stop offset="1" stop-color="#319cae"/></linearGradient>
    <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f6b74e"/><stop offset="1" stop-color="#e98239"/></linearGradient>
    <filter id="softShadow" x="-.4" y="-.5" width="1.8" height="2"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="wheel">
      <circle r="83" fill="#f8fcfa" stroke="#183b4b" stroke-width="10"/>
      <circle r="72" fill="none" stroke="#7aa0a4" stroke-width="2"/>
      <g stroke="#7aa0a4" stroke-width="2" opacity=".78">
        <path d="M0-70V70M-70 0H70M-49.5-49.5l99 99m0-99l-99 99"/>
        <path d="M-26.8-64.7l53.6 129.4M-64.7-26.8L64.7 26.8M26.8-64.7L-26.8 64.7M64.7-26.8L-64.7 26.8"/>
      </g>
      <circle r="7" fill="#e7654b" stroke="#183b4b" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g id="cloud" fill="#fff" opacity=".82">
      <ellipse cx="0" cy="18" rx="52" ry="18"/><circle cx="-20" cy="8" r="23"/><circle cx="7" cy="0" r="30"/><circle cx="32" cy="12" r="21"/>
    </g>
  </defs>

  <!-- Coastal morning -->
  <rect width="1000" height="600" fill="url(#sky)"/>
  <circle cx="820" cy="100" r="44" fill="#ffe28b" opacity=".95"/>
  <g opacity=".48"><use href="#cloud" x="150" y="92"/><use href="#cloud" x="570" y="55" transform="scale(.72) translate(220 22)"/></g>
  <path d="M0 275 Q160 240 330 274T660 268T1000 270V420H0Z" fill="#8ed4cc"/>
  <path d="M0 300 Q160 278 330 302T660 294T1000 296" fill="none" stroke="#e8fbef" stroke-width="5" opacity=".72"/>
  <path d="M0 330 Q190 307 390 333T760 325T1000 329" fill="none" stroke="#d5f5e9" stroke-width="3" opacity=".65"/>
  <path d="M0 380 Q190 352 390 370T760 363T1000 374V600H0Z" fill="#78b977"/>
  <path d="M0 440 Q300 412 610 436T1000 424V600H0Z" fill="#e8d9b9"/>
  <path d="M0 483 Q260 462 520 482T1000 470V600H0Z" fill="#d5c39e" opacity=".55"/>
  <g fill="#f9f5d9" opacity=".7"><circle cx="77" cy="399" r="4"/><circle cx="145" cy="384" r="3"/><circle cx="864" cy="394" r="4"/><circle cx="931" cy="382" r="3"/></g>

  <!-- soft ground shadow -->
  <ellipse cx="500" cy="493" rx="300" ry="20" fill="#284b48" opacity=".18" filter="url(#softShadow)"/>

  <!-- Bicycle, with separately rotating wheels -->
  <g id="bike">
    <use href="#wheel" x="300" y="416"/>
    <use href="#wheel" x="700" y="416"/>
    <g fill="none" stroke="#e7654b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 416L430 416L390 300L300 416M430 416L570 416L505 303L390 300M505 303L570 416M505 303L640 303"/>
    </g>
    <g stroke="#183b4b" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M374 286h46"/><path d="M628 303l30-37 29 1"/><path d="M659 266l14-16"/>
    </g>
    <circle cx="430" cy="416" r="15" fill="#f7c85c" stroke="#183b4b" stroke-width="5"/>
    <g transform="translate(430 416)">
      <g>
        <path d="M0 0l27 29" stroke="#183b4b" stroke-width="8" stroke-linecap="round"/>
        <path d="M27 29h25" stroke="#f7c85c" stroke-width="9" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Rider bobbing gently with the road -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 2;0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- tail and body -->
    <path d="M450 211 Q407 198 392 232 Q421 244 454 230Z" fill="#fffaf0" stroke="#183b4b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M421 203 Q457 170 508 193 Q539 211 518 260 Q499 285 451 268 Q420 254 421 203Z" fill="#fffaf0" stroke="#183b4b" stroke-width="6"/>
    <path d="M451 204 Q482 194 512 213 Q526 233 506 260 Q478 253 457 236Z" fill="#e7f0e8"/>
    <path d="M449 204 Q473 213 501 258 Q479 255 452 239 Q432 225 449 204Z" fill="#f3b84d" opacity=".9"/>

    <!-- far leg, animated from hip to pedal -->
    <g transform="translate(478 254)">
      <path d="M0 0 Q31 24 13 57 L-18 81" fill="none" stroke="#e9a84e" stroke-width="16" stroke-linecap="round"/>
      <path d="M-18 81q-15 3-22 15l36 4q13-8 3-18" fill="#244b60" stroke="#183b4b" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" values="-12 0 0;12 0 0;-12 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- near leg -->
    <g transform="translate(468 255)">
      <path d="M0 0 Q-10 32 18 52 L45 73" fill="none" stroke="#f4bb61" stroke-width="17" stroke-linecap="round"/>
      <path d="M45 73q8 10 2 19l-33-9q-5-11 7-15" fill="#244b60" stroke="#183b4b" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" values="12 0 0;-12 0 0;12 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- neck and head -->
    <path d="M493 199 Q524 164 514 122 Q509 102 528 90 Q550 78 566 96 Q578 112 559 128 Q545 139 548 161 Q551 185 533 208Z" fill="#fffaf0" stroke="#183b4b" stroke-width="6" stroke-linejoin="round"/>
    <path d="M514 121 Q525 136 552 128 Q554 151 545 167 Q526 173 514 155Z" fill="url(#pouch)" stroke="#d96e36" stroke-width="3"/>
    <ellipse cx="542" cy="101" rx="31" ry="27" fill="#fffaf0" stroke="#183b4b" stroke-width="5"/>
    <!-- helmet -->
    <path d="M510 97 Q514 66 543 65 Q570 66 577 97 Q545 89 510 97Z" fill="#399bb6" stroke="#183b4b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M507 98q37-12 73 1" fill="none" stroke="#183b4b" stroke-width="6" stroke-linecap="round"/>
    <path d="M535 70q-9 5-13 15" fill="none" stroke="#a9e3e8" stroke-width="4" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="556" cy="103" r="5.5" fill="#183b4b"/><circle cx="558" cy="101" r="1.8" fill="#fff"/>
    <!-- long bill -->
    <path d="M568 108 Q627 99 675 118 Q628 138 572 121Z" fill="#f6c74f" stroke="#183b4b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M582 120 Q624 137 660 121 Q647 157 610 164 Q585 158 582 120Z" fill="url(#pouch)" stroke="#183b4b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M592 134q25 13 48 4" fill="none" stroke="#f9d58b" stroke-width="3" stroke-linecap="round" opacity=".8"/>

    <!-- wings and handlebars -->
    <path d="M442 203 Q461 188 488 207 Q503 218 490 237 Q472 229 449 226Z" fill="#dce9e4" stroke="#183b4b" stroke-width="4"/>
    <path d="M483 205 Q521 211 550 191 Q562 184 570 193" fill="none" stroke="#fffaf0" stroke-width="13" stroke-linecap="round"/>
    <path d="M483 205 Q521 211 550 191 Q562 184 570 193" fill="none" stroke="#183b4b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="570" cy="193" r="7" fill="#e7654b" stroke="#183b4b" stroke-width="3"/>
  </g>

  <!-- foreground road dashes move left for a sense of travel -->
  <g fill="#fff8e9" opacity=".75">
    <rect x="10" y="527" width="95" height="8" rx="4"><animate attributeName="x" values="10;-110" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="310" y="527" width="95" height="8" rx="4"><animate attributeName="x" values="310;190" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="610" y="527" width="95" height="8" rx="4"><animate attributeName="x" values="610;490" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="910" y="527" width="95" height="8" rx="4"><animate attributeName="x" values="910;790" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <g font-family="system-ui, 'Noto Sans SC', sans-serif" text-anchor="middle">
    <text x="500" y="48" font-size="24" font-weight="700" letter-spacing="5" fill="#245469">海风正好 · 慢慢骑</text>
    <text x="500" y="574" font-size="15" letter-spacing="2" fill="#45665e" opacity=".8">PELican on the move</text>
  </g>
</svg>
